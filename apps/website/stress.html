<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>scritto stress</title>
    <link rel="stylesheet" href="/src/dev/dev.css" />
  </head>
  <body class="m-6 max-w-3xl">
    <p>
      <a class="text-accent no-underline hover:text-fg" href="./playground.html">playground</a>
      ·
      <a class="text-accent no-underline hover:text-fg" href="./look.html">look</a>
      ·
      <a class="text-accent no-underline hover:text-fg" href="./suite.html">suite</a>
      ·
      <a class="text-accent no-underline hover:text-fg" href="./bench.html">bench</a>
    </p>
    <p class="text-muted">
      Many hosts in running copy. Spans, block divs, scritto-flow wrap, and a pretext width check.
    </p>
    <form class="mb-4 flex flex-wrap items-end gap-3" id="form">
      <label class="flex flex-col gap-1 text-sm">
        scenario
        <select class="rounded-lg bg-surface px-2 py-1.5" id="scenario" name="scenario">
          <option value="spans">spans in text</option>
          <option value="divs">divs in text</option>
          <option value="mixed">mixed</option>
          <option value="flow">scritto-flow</option>
        </select>
      </label>
      <label class="flex flex-col gap-1 text-sm">
        hosts
        <input class="w-20 rounded-lg bg-surface px-2 py-1.5" id="count" name="count" type="number" min="8" max="400" value="64" />
      </label>
      <label class="flex flex-col gap-1 text-sm">
        rounds
        <input class="w-20 rounded-lg bg-surface px-2 py-1.5" id="rounds" name="rounds" type="number" min="4" max="200" value="40" />
      </label>
      <label class="flex flex-col gap-1 text-sm">
        runs
        <input class="w-20 rounded-lg bg-surface px-2 py-1.5" id="runs" name="runs" type="number" min="1" max="9" value="3" />
      </label>
      <button class="cursor-pointer rounded-lg bg-surface px-3 py-1.5 font-medium" id="run" type="submit">Run</button>
    </form>
    <pre class="mb-6 max-w-2xl rounded-lg bg-surface p-3 text-sm" id="out">idle</pre>
    <div class="text-[17px] leading-7" id="page"></div>
    <script type="module" src="/src/dev/stress.ts"></script>
  </body>
</html>
